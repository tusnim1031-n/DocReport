name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: ตรวจชนิดข้อมูล ทดสอบ และ build
    runs-on: ubuntu-latest
    steps:
      - name: ดึงโค้ด
        uses: actions/checkout@v4

      - name: ติดตั้ง Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: ติดตั้ง dependencies
        run: npm ci

      - name: รันชุดทดสอบ
        run: npm test

      - name: ตรวจ TypeScript และ build
        run: npm run build
