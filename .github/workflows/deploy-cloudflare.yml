name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: build แล้ว deploy ขึ้น Cloudflare Workers
    runs-on: ubuntu-latest
    steps:
      - name: ดึงโค้ด
        uses: actions/checkout@v4

      - name: ติดตั้ง Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: ติดตั้ง dependencies
        run: npm ci

      - name: รันชุดทดสอบ
        run: npm test

      - name: build (tsc + vite)
        run: npm run build

      - name: ตรวจว่าตั้งค่า Cloudflare secrets แล้วหรือยัง
        id: check
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_TOKEN" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Cloudflare::ยังไม่ได้ตั้งค่า CLOUDFLARE_API_TOKEN — ข้ามการ deploy (ดูวิธีตั้งค่าใน README)"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy ขึ้น Cloudflare Workers
        if: steps.check.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
